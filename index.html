<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://img.icons8.com/ios-filled/500/s.png"
    />
    <title>Sai Nikhil — Full-Stack Developer</title>
    <meta
      name="description"
      content="Sai Nikhil Mullapudi — full-stack developer. Selected work, experience, and LeetCode ledger."
    />
    <meta name="author" content="Sai Nikhil" />
    <script>
      // pre-hydration theme: avoid flash before React mounts
      (function () {
        try {
          var t = localStorage.getItem('portfolio-ui-theme');
          var dark =
            t === 'dark' ||
            ((!t || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
